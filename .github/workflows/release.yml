name: Release App

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags, e.g., v1.0.0

jobs:
  build-release:
    name: Build & Release Android & iOS
    runs-on: macos-latest
    permissions:
      contents: write

    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Create .env file for Release
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build Android Release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Rename Android APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Aven-android.apk

      - name: Build iOS Unsigned IPA for Sideloading
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.env
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qr Aven-ios.ipa Payload

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Aven-android.apk
            Aven-ios.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
